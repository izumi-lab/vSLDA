name: ci

on:
  push:
  pull_request:

# Both jobs run the same quality gate in the same order:
# isort -> black -> ruff check -> pytest
jobs:
  checks:
    name: checks (poetry)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install Poetry
        run: python -m pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction --only main,dev
      - name: Install NLTK data
        run: poetry run setup-nltk
      - name: Isort
        run: poetry run isort --check-only .
      - name: Black
        run: poetry run black --check .
      - name: Ruff
        run: poetry run ruff check .
      - name: Pytest
        run: poetry run pytest -q -m "not slow and not integration"

  uv:
    name: checks (uv)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Install NLTK data
        run: uv run setup-nltk
      - name: Isort
        run: uv run isort --check-only .
      - name: Black
        run: uv run black --check .
      - name: Ruff
        run: uv run ruff check .
      - name: Pytest
        run: uv run pytest -q -m "not slow and not integration"
